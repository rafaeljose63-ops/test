<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Goodnight 🌙</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --deep: #05030f;
      --mid: #0e0824;
      --rose: #e8a0c0;
      --lavender: #c5a8e8;
      --gold: #f0d080;
      --white: #fdf6ff;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--deep);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'EB Garamond', serif;
    }

    /* ── Canvas bg ── */
    canvas#sky {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ── Moon ── */
    .moon {
      position: fixed;
      top: 10vh; right: 12vw;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, #fef9c3, #f0d080 55%, #c8a040);
      box-shadow:
        0 0 30px 10px rgba(240,208,128,0.4),
        0 0 80px 30px rgba(240,208,128,0.15);
      z-index: 1;
      animation: moonFloat 8s ease-in-out infinite, moonReveal 2s cubic-bezier(.22,1,.36,1) both;
    }
    /* crater */
    .moon::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(160,120,20,0.18);
      top: 22px; left: 28px;
    }
    .moon::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(160,120,20,0.14);
      top: 48px; left: 16px;
    }
    @keyframes moonFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-14px) rotate(3deg); }
    }
    @keyframes moonReveal {
      from { opacity: 0; transform: translateY(-30px) scale(0.8); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Floating petals ── */
    .petal {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      font-size: 1rem;
      animation: petalFall linear infinite;
    }
    @keyframes petalFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      max-width: 480px;
    }

    .eyebrow {
      font-family: 'EB Garamond', serif;
      font-size: 0.8rem;
      letter-spacing: 0.5em;
      color: var(--lavender);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1s 0.3s cubic-bezier(.22,1,.36,1) forwards;
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 8vw, 5.2rem);
      font-style: italic;
      font-weight: 400;
      color: var(--white);
      line-height: 1.08;
      margin: 18px 0 0;
      opacity: 0;
      animation: fadeUp 1.1s 0.55s cubic-bezier(.22,1,.36,1) forwards;
    }
    .headline em {
      font-style: normal;
      color: var(--rose);
      display: block;
    }

    .sub {
      font-size: 1.1rem;
      color: rgba(253,246,255,0.55);
      font-style: italic;
      margin-top: 22px;
      letter-spacing: 0.06em;
      opacity: 0;
      animation: fadeUp 1.1s 0.85s cubic-bezier(.22,1,.36,1) forwards;
    }

    .hearts-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 36px;
      opacity: 0;
      animation: fadeUp 1s 1.2s cubic-bezier(.22,1,.36,1) forwards;
    }
    .hrt {
      font-size: 1.3rem;
      animation: heartbeat 2.2s ease-in-out infinite;
      color: var(--rose);
      filter: drop-shadow(0 0 8px rgba(232,160,192,0.8));
    }
    .hrt:nth-child(2) { animation-delay: 0.4s; font-size: 1.0rem; color: var(--lavender); }
    .hrt:nth-child(3) { animation-delay: 0.8s; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      30%       { transform: scale(1.35); }
      60%       { transform: scale(1.1); }
    }

    /* sparkle ring */
    .ring {
      position: absolute;
      inset: -60px;
      border-radius: 50%;
      border: 1px solid rgba(197,168,232,0.08);
      z-index: -1;
      animation: ringPulse 5s ease-in-out infinite;
    }
    .ring:nth-child(2) { inset: -100px; animation-delay: 1s; border-color: rgba(232,160,192,0.06); }
    @keyframes ringPulse {
      0%, 100% { transform: scale(0.97); opacity: 0.4; }
      50%       { transform: scale(1.03); opacity: 1; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Shooting stars ── */
    .shoot {
      position: fixed;
      z-index: 1;
      width: 2px;
      height: 80px;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 100%);
      border-radius: 2px;
      opacity: 0;
      animation: shoot linear infinite;
    }
    @keyframes shoot {
      0%   { opacity: 0; transform: translateX(0) translateY(0) rotate(35deg); }
      5%   { opacity: 1; }
      30%  { opacity: 0; transform: translateX(300px) translateY(200px) rotate(35deg); }
      100% { opacity: 0; transform: translateX(300px) translateY(200px) rotate(35deg); }
    }
  </style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="moon"></div>

<!-- Shooting stars -->
<div class="shoot" style="top:15%;left:20%;animation-duration:6s;animation-delay:1.5s;"></div>
<div class="shoot" style="top:30%;left:60%;animation-duration:8s;animation-delay:4s;"></div>
<div class="shoot" style="top:8%;left:45%;animation-duration:7s;animation-delay:7s;"></div>

<div class="card">
  <div class="ring"></div>
  <div class="ring"></div>
  <p class="eyebrow">a message for you</p>
  <h1 class="headline">
    Goodnight,<br>
    <em>I Love You</em>
    so much Loly.
  </h1>
  <p class="sub">sleep tight & dream of something beautiful 🌙</p>
  <div class="hearts-row">
    <span class="hrt">♥</span>
    <span class="hrt">♥</span>
    <span class="hrt">♥</span>
  </div>
</div>

<script>
  /* ── Starfield canvas ── */
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // create stars
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.4 + 0.3,
      a: Math.random(),
      da: (Math.random() * 0.005 + 0.002) * (Math.random() < 0.5 ? 1 : -1),
      col: Math.random() < 0.2
           ? `rgba(200,180,255,`
           : Math.random() < 0.15
           ? `rgba(255,220,200,`
           : `rgba(255,255,255,`
    });
  }

  // gradient bg
  function drawBg() {
    const g = ctx.createRadialGradient(W*0.5, H*0.4, 0, W*0.5, H*0.4, H*0.9);
    g.addColorStop(0, '#120a2a');
    g.addColorStop(0.5, '#0a051a');
    g.addColorStop(1, '#03020b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  let t = 0;
  function frame() {
    t += 0.012;
    drawBg();
    for (const s of stars) {
      s.a += s.da;
      if (s.a <= 0 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.col + s.a.toFixed(2) + ')';
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();

  /* ── Petals ── */
  const emojis = ['✿', '❀', '✾', '⋆', '·'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.cssText = `
      left: ${Math.random()*100}vw;
      font-size: ${(Math.random()*0.8+0.6).toFixed(1)}rem;
      color: ${Math.random()<0.5 ? 'rgba(232,160,192,0.6)' : 'rgba(197,168,232,0.5)'};
      animation-duration: ${(Math.random()*12+10).toFixed(1)}s;
      animation-delay: ${(Math.random()*10).toFixed(1)}s;
    `;
    document.body.appendChild(p);
  }
</script>
</body>
</html>
